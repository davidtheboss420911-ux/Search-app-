version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2026.06

    steps:
      - checkout

      - run:
          name: Make Gradle executable
          command: chmod +x gradlew

      - run:
          name: Build Android app
          command: ./gradlew assembleDebug

workflows:
  build:
    jobs:
      - build